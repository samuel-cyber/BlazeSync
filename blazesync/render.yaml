# Render Blueprint — deploys the BlazeSync API pointed at Supabase Postgres.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Render provisions ONLY the Python web service here; the database is your
# Supabase project (external), so it is NOT declared in this file.
#
# Before applying, create a Supabase project and copy its connection string —
# you'll paste it into the DATABASE_URL prompt Render shows on apply.
services:
  - type: web
    name: blazesync-api
    runtime: python
    plan: free
    healthCheckPath: /api/health
    # Build runs the Alembic migrations against Supabase, then starts uvicorn.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # --- Supabase Postgres ---------------------------------------------
      # Paste the Supabase connection string at the apply prompt. Use the
      # Session Pooler URI (host ...pooler.supabase.com, port 5432) — it is
      # IPv4-reachable, which Render's free tier requires. app/config.py
      # normalizes postgres://  →  postgresql+psycopg:// automatically.
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # --- Security ------------------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      # Build already ran `alembic upgrade head`, so don't re-run on boot.
      - key: AUTO_MIGRATE
        value: "false"
      - key: RECONCILE_INTERVAL_SECONDS
        value: "300"
      # --- Public origin / CORS -----------------------------------------
      # Set these to THIS service's URL once Render assigns it (or your custom
      # domain). ALLOWED_ORIGINS is your FRONTEND origin, comma-separated.
      - key: PUBLIC_BASE_URL
        value: https://blazesync-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://blazesync-api.onrender.com
      # --- Ecobank (OPTIONAL) -------------------------------------------
      # Leave unset to run in deterministic mock bank mode. Add these directly
      # in the Dashboard → Environment tab once your sandbox email arrives:
      #   ECOBANK_USER_ID / ECOBANK_PASSWORD / ECOBANK_LAB_KEY / ECOBANK_CLIENT_ID
      #   ECOBANK_AFFILIATE_CODE / ECOBANK_SOURCE_CODE
      #   ECOBANK_BASE_URL / ECOBANK_WEBHOOK_SECRET
