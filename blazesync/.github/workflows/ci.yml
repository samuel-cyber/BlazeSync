name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: blazesync

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      # BlazeSync is Postgres-only by design — the suite runs against a real
      # Postgres so triggers, constraints, and advisory locks are exercised.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blazesync
          POSTGRES_PASSWORD: blazesync
          POSTGRES_DB: blazesync
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blazesync"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blazesync/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app migrations tests

      - name: Tests (pytest, real Postgres)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql://blazesync:blazesync@localhost:5433/blazesync
        run: pytest -q
